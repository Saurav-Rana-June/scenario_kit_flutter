name: scenario_kit_flutter
description: A developer-focused Flutter toolkit to define, preview, test, and switch between UI scenarios without altering production code.
version: 0.2.0
homepage: https://github.com/Saurav-Rana-June/scenario_kit_flutter
repository: https://github.com/Saurav-Rana-June/scenario_kit_flutter
issue_tracker: https://github.com/Saurav-Rana-June/scenario_kit_flutter/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

topics:
  - developer-tools
  - ui
  - testing
  - widget-preview
  - state-management
